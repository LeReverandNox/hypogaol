[package]
name = "tomb-fido2"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/LeReverandNox/tomb-fido2"

# publish = false hides this crate from cargo-dist by default (it only considers
# publishable packages); this override tells it to build/dist this binary anyway.
[package.metadata.dist]
dist = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
anyhow = "1.0.104"
zeroize = "1.9.0"
getrandom = "0.4"
clap = { version = "4.6.4", features = ["derive"] }

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
create-release = false
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

# cargo-dist builds with `--profile dist` by convention; without this section
# cargo rejects the build outright with "profile `dist` is not defined"
# (confirmed by the first real end-to-end run of this pipeline, 2026-07-28 —
# never caught before because it had never been exercised past `dist plan`).
[profile.dist]
inherits = "release"
